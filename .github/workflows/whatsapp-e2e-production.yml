name: WhatsApp E2E Production

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Production base URL to test
        required: true
        default: https://caferoast.cl
      run_transfer:
        description: Create a NO PREPARAR transfer order and move paid -> delivering -> delivered through WhatsApp webhook actions
        required: true
        type: boolean
        default: true
      run_expired:
        description: Create a second NO PREPARAR transfer order and expire it through a WhatsApp webhook action
        required: true
        type: boolean
        default: false
      run_flow_real:
        description: Create a Flow real payment link, wait for human payment, then complete dispatch states through WhatsApp webhook actions
        required: true
        type: boolean
        default: false

concurrency:
  group: whatsapp-e2e-production
  cancel-in-progress: false

jobs:
  whatsapp-e2e:
    name: Real WhatsApp integration against production
    runs-on: ubuntu-latest
    environment: production
    env:
      PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${{ secrets.WHATSAPP_WEBHOOK_VERIFY_TOKEN }}
      WHATSAPP_APP_SECRET: ${{ secrets.WHATSAPP_APP_SECRET }}
      WHATSAPP_ACTION_SECRET: ${{ secrets.WHATSAPP_ACTION_SECRET }}
      WHATSAPP_OPERATOR_PHONES: ${{ secrets.WHATSAPP_OPERATOR_PHONES }}
      WHATSAPP_NOTIFY_TO: ${{ secrets.WHATSAPP_NOTIFY_TO }}
      WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
      FLOW_PAYMENT_WAIT_SECONDS: 900
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Flow real safety notice
        if: ${{ inputs.run_flow_real }}
        run: |
          echo "::warning title=Flow prerequisite::Before this run, set Config.settings flow_enabled=true in Roast_Control_Costos."
          echo "::warning title=Flow cleanup::After this run, restore Config.settings flow_enabled=false and handle any real payment reversal manually if needed."

      - name: Run production WhatsApp E2E
        shell: bash
        run: |
          set -euo pipefail
          node scripts/e2e-whatsapp-production.mjs \
            --base-url "${{ inputs.base_url }}" \
            --run-transfer="${{ inputs.run_transfer }}" \
            --run-expired="${{ inputs.run_expired }}" \
            --run-flow-real="${{ inputs.run_flow_real }}"
